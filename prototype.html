<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code GUI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: project tabs (Ghostty-like) on top; file list | preview below. The GUI only views and edits files. */
:root{
  /* palette: #FAFAF8 #DADADA #B0B3B8 #43464B #0F1012 */
  --bg:#FAFAF8; --panel:#FAFAF8; --line:#DADADA; --ink:#0F1012; --mute:#43464B;
  --accent:#0F1012; --accent-soft:#DADADA; --ok:#1f8f5f; --code:#EAEAE9;
  --add-bg:#e7f6ed; --del-bg:#fdecec; --del-ink:#c23b3b;
  --sans:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1012; --panel:#0F1012; --line:#43464B; --ink:#FAFAF8; --mute:#B0B3B8;
    --accent:#DADADA; --accent-soft:#43464B; --ok:#4cc38a; --code:#292B2F;
    --add-bg:#16301f; --del-bg:#3a1d21; --del-ink:#ff8a8a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1012; --panel:#0F1012; --line:#43464B; --ink:#FAFAF8; --mute:#B0B3B8;
  --accent:#DADADA; --accent-soft:#43464B; --ok:#4cc38a; --code:#292B2F;
  --add-bg:#16301f; --del-bg:#3a1d21; --del-ink:#ff8a8a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.6 var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mut{color:var(--mute)}.a{color:var(--ok)}.d{color:var(--del-ink)}.grow{flex:1}

.app{--lw:300px;--sth:28px;position:relative;height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:34px 34px minmax(0,1fr) var(--sth)}
.app.no-list .files{grid-template-columns:minmax(0,1fr)}.app.no-list .files > .col,.app.no-list .split{display:none}
.app.no-status{--sth:0px}.app.no-status .status{display:none}

/* project tabs */
.tabbar{display:flex;align-items:stretch;background:var(--bg);border-bottom:1px solid var(--line)}
.ptabs{display:flex;min-width:0;overflow-x:auto}
.ptab{display:flex;align-items:center;border-right:1px solid var(--line);color:var(--mute);max-width:220px}
.ptab.active{background:var(--accent-soft);color:var(--ink)}
.ptab.active .x:hover{background:var(--bg)}
.ptab > button:first-child{display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;height:100%;white-space:nowrap;min-width:0}
.ptab .n{font:500 10px var(--mono);color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 4px;line-height:15px}
.ptab .nm{overflow:hidden;text-overflow:ellipsis;font-size:13px}
.ptab .x{padding:2px 6px;margin-right:6px;font-size:14px;line-height:1;border-radius:4px;opacity:0}
.ptab:hover .x,.ptab.active .x{opacity:.7}
.ptab .x:hover{background:var(--code)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.mini{width:28px;height:4px;border-radius:2px;background:var(--line);overflow:hidden;flex:none}
.mini i{display:block;height:100%;background:var(--ok)}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;font:12px var(--sans)}
.seg button{padding:1px 10px;color:var(--mute)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.toolbar{display:flex;align-items:center;gap:2px;padding:0 6px;background:var(--bg);border-bottom:1px solid var(--line)}
.tsep{width:1px;height:16px;background:var(--line);margin:0 6px}
.ibtn{position:relative;width:30px;height:26px;display:grid;place-items:center;border-radius:6px;color:var(--mute)}
.ibtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ibtn:hover:not(:disabled){background:var(--accent-soft);color:var(--ink)}
.ibtn:disabled{opacity:.35;cursor:default}
.ibtn[aria-pressed="true"]{color:var(--ink)}
.ibtn .bdg{position:absolute;top:0;right:0;font:500 9px/13px var(--mono);min-width:13px;background:var(--accent);color:var(--panel);border-radius:7px;padding:0 3px}
.ibtn .bdg:empty{display:none}

/* file list | preview */
.files{background:var(--panel);min-width:0;min-height:0;display:grid;grid-template-columns:min(var(--lw),100%) minmax(0,1fr);grid-template-rows:minmax(0,1fr);overflow:hidden}
.col{border-right:1px solid var(--line);overflow:auto;padding:6px;min-width:0}
.row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:3px 8px;border-radius:6px;min-height:28px;color:var(--ink)}
.row:hover{background:var(--code)}
.row.sel{background:var(--accent-soft);font-weight:500}
.row .b{font:500 9px var(--mono);color:var(--mute);width:22px;flex:none;text-transform:uppercase}
.row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.dir .name{color:var(--accent)}
.row .info{font:11px var(--mono);color:var(--mute);margin-left:auto}
.dim .row{color:var(--mute);pointer-events:none}
.dim .row.dir .name{color:var(--mute)}
.pv{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.pv-head{display:flex;align-items:center;gap:10px;padding:0 14px;min-height:36px;border-bottom:1px solid var(--line);font:12px var(--mono);color:var(--mute);white-space:nowrap}
.pv-head .path{overflow:hidden;text-overflow:ellipsis;flex:1}
.pv-body{flex:1;min-height:0;overflow:auto;position:relative}
.files[data-pane="preview"] .gright .gp{border-color:var(--accent)}
.files[data-pane="preview"] .gcol .gp.on{border-color:var(--line)}
.empty{height:100%;display:grid;place-items:center;color:var(--mute);padding:24px;text-align:center}

/* rendered markdown */
.doc{max-width:720px;margin:0 auto;padding:24px 24px 80px}
.doc h1{font-size:22px;line-height:1.3;margin:0 0 14px;text-wrap:balance}
.doc h2{font-size:16px;margin:26px 0 8px;text-wrap:balance}
.doc h3{font-size:14px;margin:20px 0 6px;color:var(--mute)}
.doc p{margin:8px 0}
.doc code{font:13px var(--mono);background:var(--code);padding:1px 5px;border-radius:4px}
.doc pre.code{font:12.5px/1.6 var(--mono);background:var(--code);padding:12px 14px;border-radius:8px;overflow:auto;margin:12px 0}
.doc blockquote{margin:12px 0;padding:2px 14px;border-left:3px solid var(--line);color:var(--mute)}
.doc hr{border:0;border-top:1px solid var(--line);margin:20px 0}
.doc a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-soft)}
.doc a:hover{border-bottom-color:var(--accent)}
.doc table{border-collapse:collapse;margin:12px 0;font-size:13px;width:100%}
.doc th,.doc td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left}
.doc th{color:var(--mute);font-weight:500}
.li{display:flex;gap:10px;align-items:flex-start;padding:2px 6px;margin-left:calc(var(--d)*20px);border-radius:6px}
.li .mk{color:var(--mute);width:14px;flex:none;text-align:center;font-size:12px;line-height:1.9;font-variant-numeric:tabular-nums}
.li .done{color:var(--mute);text-decoration:line-through;text-decoration-color:var(--line)}
.cb{width:16px;height:16px;margin-top:4px;border:1.5px solid var(--mute);border-radius:4px;flex:none;position:relative}
.cb:hover{border-color:var(--accent)}
.cb.on{background:var(--ok);border-color:var(--ok)}
.cb.on::after{content:"";position:absolute;left:4px;top:0;width:4px;height:9px;border:solid var(--panel);border-width:0 2px 2px 0;transform:rotate(45deg)}
.pbar{display:flex;align-items:center;gap:10px;margin:0 0 18px;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.pbar .track{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.pbar .track i{display:block;height:100%;background:var(--ok);transition:width .4s}
textarea.editor{width:100%;height:100%;border:0;resize:none;background:var(--panel);color:var(--ink);font:13px/1.75 var(--mono);padding:24px max(24px,calc(50% - 360px));outline:none;tab-size:2}
iframe.preview{width:100%;height:100%;border:0;background:#fff;display:block}
.codeview{display:grid;grid-template-columns:auto 1fr;font:12.5px/1.7 var(--mono);padding:14px 0 60px;min-width:max-content}
.codeview .ln{color:var(--mute);text-align:right;padding:0 14px 0 18px;user-select:none;opacity:.6}
.codeview .src{white-space:pre;padding-right:24px}
.k{color:var(--accent);font-weight:500}.s{color:var(--ok)}.c{color:var(--mute);font-style:italic}

/* diff view (read only) */
.gcol{display:flex;flex-direction:column;gap:14px;padding:14px 12px 10px;overflow:hidden}
.gp{position:relative;border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-height:34px;min-width:0}
.gp.on{border-color:var(--accent)}
.gt{position:absolute;top:-10px;left:10px;background:var(--panel);padding:0 5px;font:12px/18px var(--mono);color:var(--mute);z-index:2;white-space:nowrap}
.gp.on .gt{color:var(--accent)}
.gc{position:absolute;bottom:-10px;right:10px;background:var(--panel);padding:0 5px;font:11px/18px var(--mono);color:var(--mute);z-index:2}
.gl{flex:1;min-height:0;overflow:auto;padding:6px 0;font:12.5px/1.6 var(--mono)}
.gr{display:flex;gap:8px;align-items:center;padding:0 10px;white-space:nowrap;cursor:pointer;min-height:22px}
.gr:hover,.gr.sel{background:var(--code)}
.gp.on .gr.sel{background:var(--accent-soft)}
.gr .tx{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.gr .hash{color:var(--accent)}
.st{font:600 10px var(--mono);width:12px;flex:none}
.st.A{color:var(--ok)}.st.M{color:var(--accent)}
.cnt{font:11px var(--mono);display:flex;gap:6px;flex:none}
.gright{display:flex;flex-direction:column;padding:14px 12px 10px;min-width:0;min-height:0}
.gright .gp{flex:1}
.gright .gl{padding:0}
.fh{display:flex;justify-content:space-between;gap:12px;padding:5px 14px;background:var(--code);font:12px var(--mono);position:sticky;top:0;z-index:1;margin-top:10px}
.fh:first-child{margin-top:0}
.ch{padding:8px 14px;font:12.5px/1.7 var(--mono)}
.ch .hash{color:var(--accent)}
.diff{font:12.5px/1.65 var(--mono);min-width:max-content;padding:0 0 60px}
.hh{color:var(--mute);background:var(--code);padding:2px 14px;margin-top:12px}
.dl{display:grid;grid-template-columns:44px 44px 1fr}
.dl .n{color:var(--mute);text-align:right;padding-right:10px;user-select:none;opacity:.7}
.dl .t{white-space:pre;padding-right:24px}
.dl.add{background:var(--add-bg)}.dl.del{background:var(--del-bg)}

/* resizable list width */
.split{position:absolute;top:68px;bottom:var(--sth);width:9px;cursor:col-resize;z-index:5;touch-action:none;outline:none;left:calc(min(var(--lw),100%) - 4px)}
.split::after{content:"";position:absolute;left:4px;top:0;bottom:0;width:1px;background:transparent}
.split:hover::after,.split.on::after,.split:focus-visible::after{background:var(--accent);width:2px;left:3px}
.dragging{cursor:col-resize;user-select:none}
.dragging iframe{pointer-events:none}

/* status */
.status{display:flex;align-items:center;gap:16px;padding:0 12px;border-top:1px solid var(--line);background:var(--bg);font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.status .crumb{font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;min-width:0}
.status .crumb b{color:var(--ink);font-weight:500}
.status .pg{display:flex;align-items:center;gap:8px}
.status .pg .mini{width:64px;height:5px}
.status .sp{flex:1}
kbd{font:11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--panel);color:var(--mute)}

@media (max-width:820px){
  .files{grid-template-columns:minmax(120px,42%) minmax(0,1fr)}
  .hint{display:none}
  .split{display:none}
}
@media (prefers-reduced-motion:reduce){.pbar .track i{transition:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="toolbar">
    <button class="ibtn" id="btnNew" aria-label="新しいプロジェクト" title="新しいプロジェクト"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button>
    <span class="tsep"></span>
    <button class="ibtn" id="btnView"></button>
    <button class="ibtn" id="btnMode"></button>
    <span class="tsep"></span>
    <button class="ibtn" id="btnList" aria-pressed="true"><svg viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="11" rx="1.5"/><path d="M6 2.5v11"/></svg></button>
    <button class="ibtn" id="btnStatus" data-panel="status" aria-pressed="true"><svg viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="11" rx="1.5"/><path d="M2 10h12"/></svg></button>
  </div>
  <div class="tabbar">
    <div class="ptabs" id="ptabs" role="tablist" aria-label="プロジェクト"></div>
  </div>
  <main class="files" id="files" aria-label="ファイル"></main>
  <div class="split" id="splitFiles" role="separator" aria-orientation="vertical" aria-label="ファイル一覧の幅" tabindex="0" title="ドラッグで幅を変更（ダブルクリックでリセット）"></div>
  <footer class="status" id="status"></footer>
</div>

function lines(t){ return (t === null || t === "") ? [] : t.split("\n"); }
function diffOps(a, b){
  var A = lines(a), B = lines(b), n = A.length, m = B.length, pre = 0, suf = 0, i, j, raw = [];
  while(pre < n && pre < m && A[pre] === B[pre]) pre++;
  while(suf < n-pre && suf < m-pre && A[n-1-suf] === B[m-1-suf]) suf++;
  var X = A.slice(pre, n-suf), Y = B.slice(pre, m-suf), nx = X.length, ny = Y.length;
  for(i=0;i<pre;i++) raw.push({t:" ", s:A[i]});
  if(nx*ny > 4000000){
    X.forEach(function(t){ raw.push({t:"-", s:t}); }); Y.forEach(function(t){ raw.push({t:"+", s:t}); });
  } else {
    var w = ny+1, dp = new Int32Array((nx+1)*w);

    i = 0; j = 0;
    while(i < nx && j < ny){
      if(X[i] === Y[j]){ raw.push({t:" ", s:X[i]}); i++; j++; }
      else if(dp[(i+1)*w+j] >= dp[i*w+j+1]){ raw.push({t:"-", s:X[i]}); i++; }
      else { raw.push({t:"+", s:Y[j]}); j++; }
    }
    while(i < nx){ raw.push({t:"-", s:X[i]}); i++; }
    while(j < ny){ raw.push({t:"+", s:Y[j]}); j++; }
  }
  for(i=n-suf;i<n;i++) raw.push({t:" ", s:A[i]});

  ops.forEach(function(o,i){

    if(!h){ h = {rows:[], a0:o.a, b0:o.b, ac:0, bc:0}; hs.push(h); }

/* ---------- markdown / code ---------- */
function mdRender(src){
  var L = src.split("\n"), n = L.length, i = 0, out = [], m;
  while(i < n){
    var l = L[i];
    if(/^```/.test(l)){
      var buf = []; i++;
      while(i < n && !/^```/.test(L[i])){ buf.push(L[i]); i++; }
      i++; out.push('<pre class="code">'+esc(buf.join("\n"))+'</pre>'); continue;
    }
    if((m = l.match(/^(#{1,4})\s+(.*)/))){ out.push("<h"+m[1].length+">"+inline(m[2])+"</h"+m[1].length+">"); i++; continue; }
    if(/^---+\s*$/.test(l)){ out.push("<hr>"); i++; continue; }
    if(/^>\s?/.test(l)){
      var q = [];
      while(i < n && /^>\s?/.test(L[i])){ q.push(L[i].replace(/^>\s?/,"")); i++; }
      out.push("<blockquote>"+inline(q.join(" "))+"</blockquote>"); continue;
    }
    if(l.trim().charAt(0) === "|" && i+1 < n && /^\s*\|[\s:|-]+\|\s*$/.test(L[i+1])){
      var cells = function(r){ return r.trim().replace(/^\||\|$/g,"").split("|").map(function(c){ return c.trim(); }); };
      var h = cells(l); i += 2;
      var t = "<table><thead><tr>"+h.map(function(c){ return "<th>"+inline(c)+"</th>"; }).join("")+"</tr></thead><tbody>";
      while(i < n && L[i].trim().charAt(0) === "|"){
        t += "<tr>"+cells(L[i]).map(function(c){ return "<td>"+inline(c)+"</td>"; }).join("")+"</tr>"; i++;
      }
      out.push(t+"</tbody></table>"); continue;
    }
    if((m = l.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/))){
      var d = Math.floor(m[1].length/2), task = m[3].match(/^\[( |x)\]\s+(.*)/i);
      if(task){
        var on = task[1].toLowerCase() === "x";
        out.push('<div class="li" style="--d:'+d+'"><button class="cb'+(on?" on":"")+'" data-line="'+i+'" role="checkbox" aria-checked="'+on+'" aria-label="'+esc(task[2])+'"></button><span class="'+(on?"done":"")+'">'+inline(task[2])+'</span></div>');
      } else {
        out.push('<div class="li" style="--d:'+d+'"><span class="mk">'+(/\d/.test(m[2]) ? m[2] : "•")+'</span><span>'+inline(m[3])+'</span></div>');
      }
      i++; continue;
    }
    if(!l.trim()){ i++; continue; }
    var pp = [];
    while(i < n && L[i].trim() && !/^(#{1,4}\s|```|>|\s*([-*]|\d+\.)\s|\|)/.test(L[i])){ pp.push(L[i]); i++; }
    if(!pp.length){ pp.push(L[i]); i++; }
    out.push("<p>"+inline(pp.join(" "))+"</p>");
  }
  return out.join("\n");
}
function highlight(src){
  var re = /(\/\/.*$)|("(?:[^"\\]|\\.)*"|'[^']*')|\b(const|let|function|import|from|export|return|type|if|else|new)\b/gm;
  return esc(src).replace(re,function(a,c,s,k){
    if(c) return '<span class="c">'+c+'</span>';

function newProject(){
  seq++;
  P.push(mk("new-"+seq, {"PLAN.md":"# PLAN\n\n- [ ] 最初のタスクを書く\n- [ ] CLIで進める", "README.md":"# new-"+seq+"\n\n新しいプロジェクト。"}, true));
  cur = P.length-1; render();
}
function closeProject(i){
  if(P.length < 2) return;
  P.splice(i,1); cur = Math.min(cur, P.length-1); render();
}

/* ---------- events ---------- */
$("ptabs").addEventListener("click",function(e){
  var c = e.target.closest("[data-pclose]"); if(c){ closeProject(+c.dataset.pclose); return; }
  var t = e.target.closest("[data-ptab]"); if(t) switchTo(+t.dataset.ptab);
});
$("btnNew").addEventListener("click",newProject);
$("btnView").addEventListener("click",function(){ setView(proj().view === "diff" ? "files" : "diff"); });
$("btnMode").addEventListener("click",edit);
/* ---------- panel visibility ---------- */
var PANEL = {list:"ファイル一覧", status:"フッター"}, hidden = {};
try{ hidden = JSON.parse(localStorage.getItem("ccg-panels") || "{}") || {}; delete hidden.tabs; }catch(_){ hidden = {}; }
function applyPanels(){
  Object.keys(PANEL).forEach(function(k){
    var on = !hidden[k], b = $(k === "list" ? "btnList" : "btnStatus"), l = PANEL[k]+(on ? "を隠す" : "を表示");
    $("app").classList.toggle("no-"+k, !on);
    b.setAttribute("aria-pressed", String(on)); b.title = l; b.setAttribute("aria-label", l);
  });
}
function togglePanel(k){
  hidden[k] = !hidden[k]; applyPanels();
  try{ localStorage.setItem("ccg-panels", JSON.stringify(hidden)); }catch(_){}
}
$("btnList").addEventListener("click",function(){ togglePanel("list"); });
$("btnStatus").addEventListener("click",function(){ togglePanel("status"); });
applyPanels();
["btnNew","btnView","btnMode","btnList","btnStatus"].forEach(function(id){ $(id).addEventListener("mousedown",function(e){ e.preventDefault(); }); });
$("files").addEventListener("pointerdown",function(e){
  if(e.target.closest(".pv, .gright")) setPane("preview");
  else if(e.target.closest(".col")) setPane("list");
});
$("files").addEventListener("mousedown",function(e){ if(e.target.closest(".row, .gr")) e.preventDefault(); });
$("files").addEventListener("click",function(e){
  var p = proj();
  if(p.view === "diff"){
    var r = e.target.closest("[data-gi]");
    if(r){ var pr = r.dataset.gi.split(":"); p.gfocus = pr[0]; p.gi[pr[0]] = +pr[1]; renderDiff(p); renderStatus(); return; }
    var gp = e.target.closest("[data-gp]");
    if(gp){ p.gfocus = gp.dataset.gp; renderDiff(p); renderStatus(); }
    return;
  }
  var cb = e.target.closest(".cb");
  if(cb){
    var en2 = current(p), f = p.files[en2.path], L = f.content.split("\n"), i = +cb.dataset.line;
    L[i] = /\[x\]/i.test(L[i]) ? L[i].replace(/\[x\]/i,"[ ]") : L[i].replace("[ ]","[x]");
    f.content = L.join("\n");
    renderTabs(); renderFiles(); renderStatus(); return;
  }
  var a = e.target.closest("[data-goto]"); if(a){ e.preventDefault(); goTo(p, a.dataset.goto); return; }
  var row = e.target.closest(".row"); if(!row) return;
  p.sel[p.cwd] = row.dataset.name;
  var ce = current(p);
  if(ce.isDir){ p.cwd = ce.path; }
  renderFiles(); renderStatus();
});

document.addEventListener("keydown",function(e){
  if(e.isComposing) return;
  if(e.altKey && !e.ctrlKey && !e.metaKey){
    if(e.code === "KeyT"){ e.preventDefault(); newProject(); return; }
    if(e.code === "KeyW"){ e.preventDefault(); closeProject(cur); return; }
    var dm = e.code.match(/^Digit([1-9])$/);
    if(dm){ e.preventDefault(); switchTo(+dm[1]-1); return; }
    return;
  }
  var t = e.target;
  if(t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT")){
    if(e.key === "Escape"){
      if(t.id === "editor"){ var p0 = proj(), en = current(p0); p0.mode[en.path] = "view"; renderFiles(); setPane("list"); }
      else { t.blur(); }
    }
    return;
  }
  if(e.metaKey || e.ctrlKey) return;
  if(t && t.getAttribute && t.getAttribute("role") === "separator") return;
  var pr = proj(), pv = $("pvBody"), k = e.key;
  if(k === "v"){ e.preventDefault(); setView(pr.view === "diff" ? "files" : "diff"); return; }
  if(k === "d"){ e.preventDefault(); pv && pv.scrollBy(0,300); return; }
  if(k === "u"){ e.preventDefault(); pv && pv.scrollBy(0,-300); return; }
  if(pane === "preview"){
    if(k === "ArrowDown" || k === "j"){ e.preventDefault(); pv && pv.scrollBy(0,40); }
    else if(k === "ArrowUp" || k === "k"){ e.preventDefault(); pv && pv.scrollBy(0,-40); }
    else if(k === "Home" || k === "g"){ e.preventDefault(); pv && pv.scrollTo(0,0); }
    else if(k === "End" || k === "G"){ e.preventDefault(); pv && pv.scrollTo(0,pv.scrollHeight); }
    else if(k === "Escape"){ e.preventDefault(); setPane("list"); }
    else if(k === "e" && pr.view !== "diff"){ e.preventDefault(); edit(); }
    else if(k.indexOf("Arrow") === 0) e.preventDefault();
    return;
  }
  if(pr.view === "diff"){
    if(k === "ArrowDown" || k === "j"){ e.preventDefault(); gmove(pr, 1); }
    else if(k === "ArrowUp" || k === "k"){ e.preventDefault(); gmove(pr, -1); }
    else if(k === "ArrowLeft" || k === "h" || k === "ArrowRight" || k === "l"){
      e.preventDefault(); pr.gfocus = pr.gfocus === "changes" ? "commits" : "changes"; renderDiff(pr); renderStatus();
    }
    return;
  }
  switch(k){
    case "ArrowDown": case "j": e.preventDefault(); move(1); break;
    case "ArrowUp": case "k": e.preventDefault(); move(-1); break;
    case "ArrowLeft": case "h": e.preventDefault(); left(); break;
    case "ArrowRight": case "l": case "Enter": e.preventDefault(); right(); break;
    case "Home": case "g": e.preventDefault(); jump(false); break;
    case "End": case "G": e.preventDefault(); jump(true); break;
    case "e": e.preventDefault(); edit(); break;
  }
});

/* ---------- resizable list width ---------- */
var DEF = 300, W = DEF;
try{ var sv = JSON.parse(localStorage.getItem("ccg-widths") || "null"); if(sv && typeof sv.lw === "number") W = sv.lw; }catch(_){}
function applyW(){ $("app").style.setProperty("--lw", W+"px"); }
function saveW(){ try{ localStorage.setItem("ccg-widths", JSON.stringify({lw:W})); }catch(_){} }
function clampW(v){ var t = $("files").getBoundingClientRect().width; return Math.round(Math.max(0, Math.min(v, t))); }
(function(){
  var el = $("splitFiles");
  el.addEventListener("pointerdown",function(e){
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    document.body.classList.add("dragging"); el.classList.add("on");
  });
  el.addEventListener("pointermove",function(e){
    if(!el.hasPointerCapture(e.pointerId)) return;
    W = clampW(e.clientX - $("files").getBoundingClientRect().left); applyW();
  });
  function end(e){
    if(el.hasPointerCapture(e.pointerId)) el.releasePointerCapture(e.pointerId);
    document.body.classList.remove("dragging"); el.classList.remove("on"); saveW();
  }
  el.addEventListener("pointerup",end); el.addEventListener("pointercancel",end);
  el.addEventListener("dblclick",function(){ W = DEF; applyW(); saveW(); });
  el.addEventListener("keydown",function(e){
    if(e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault(); e.stopPropagation();
    W = clampW(W + (e.key === "ArrowRight" ? 16 : -16)); applyW(); saveW();
  });
})();
applyW();
setPane("list");
render();
})();
</script>
</body>
